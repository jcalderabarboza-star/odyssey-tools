<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supply Chain KPI Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1d23;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #0f172a;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.01em;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 20px; height: 20px; fill: #fff; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .last-updated {
      font-size: 0.75rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .last-updated svg { width: 13px; height: 13px; opacity: .7; }

    /* ── Export button ── */
    .btn-export {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn-export:hover { opacity: .88; }
    .btn-export:active { transform: scale(.97); }
    .btn-export svg { width: 14px; height: 14px; }

    /* ── Main layout ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 20px;
    }

    /* ── Summary row ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 36px;
    }
    .summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .summary-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .dot-green  { background: #dcfce7; }
    .dot-yellow { background: #fef9c3; }
    .dot-red    { background: #fee2e2; }
    .summary-info p { font-size: 0.78rem; color: #64748b; }
    .summary-info strong { font-size: 1.35rem; font-weight: 700; display: block; }

    /* ── KPI grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .kpi-card {
      background: #fff;
      border-radius: 14px;
      padding: 26px 28px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      border-top: 4px solid transparent;
      transition: box-shadow .15s;
    }
    .kpi-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.09); }
    .kpi-card.green  { border-top-color: #22c55e; }
    .kpi-card.yellow { border-top-color: #eab308; }
    .kpi-card.red    { border-top-color: #ef4444; }

    .kpi-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .kpi-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
      max-width: 70%;
      line-height: 1.35;
    }
    .status-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .badge-green  { background: #dcfce7; color: #15803d; }
    .badge-yellow { background: #fef9c3; color: #a16207; }
    .badge-red    { background: #fee2e2; color: #b91c1c; }

    /* ── KPI value + trend arrow row ── */
    .kpi-values {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi-value-group {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .kpi-current {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      cursor: pointer;
      border-bottom: 2px dashed transparent;
      transition: border-color .15s;
      outline: none;
    }
    .kpi-current:hover { border-bottom-color: currentColor; }
    .kpi-current[contenteditable="true"] {
      border-bottom-color: currentColor;
      background: rgba(0,0,0,.03);
      border-radius: 4px;
      padding: 0 4px;
    }
    .kpi-unit { font-size: 1.1rem; font-weight: 600; color: #6b7280; }

    /* ── Trend arrow (large, next to value) ── */
    .trend-arrow {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .trend-arrow svg { width: 28px; height: 28px; }

    .edit-hint {
      font-size: 0.65rem;
      color: #cbd5e1;
      margin-left: 2px;
      user-select: none;
      align-self: flex-end;
      padding-bottom: 2px;
    }

    .kpi-target {
      font-size: 0.78rem;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    .kpi-target strong { color: #6b7280; }

    /* ── Progress bar ── */
    .bar-track {
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }
    .fill-green  { background: linear-gradient(90deg, #4ade80, #22c55e); }
    .fill-yellow { background: linear-gradient(90deg, #fde047, #eab308); }
    .fill-red    { background: linear-gradient(90deg, #fca5a5, #ef4444); }

    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #9ca3af;
    }
    .bar-labels span:last-child { color: #6b7280; font-weight: 600; }

    /* ── Trend chip (bottom, month-over-month text) ── */
    .trend-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 14px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f8fafc;
      color: #64748b;
    }
    .trend-chip svg { width: 12px; height: 12px; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px;
      font-size: 0.75rem;
      color: #9ca3af;
    }

    /* ── Toast notification ── */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Print / PDF styles ── */
    @media print {
      body { background: #fff; }
      header { background: #0f172a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .btn-export { display: none !important; }
      .edit-hint  { display: none !important; }
      .kpi-card { break-inside: avoid; box-shadow: none; border: 1px solid #e2e8f0; }
      footer { display: none; }
      main { padding: 20px; }
    }

    @media (max-width: 680px) {
      header { padding: 18px 20px; }
      main { padding: 24px 16px; }
      .summary-row { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zm0 11h7v7H3zm11-11h7v7h-7zm0 11h7v7h-7z"/></svg>
    </div>
    <h1>Supply Chain KPI Dashboard</h1>
  </div>
  <div class="header-right">
    <div class="last-updated">
      <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Last updated: <span id="last-updated-time"></span>
    </div>
    <button class="btn-export" onclick="exportPDF()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="11" x2="12" y2="17"/>
        <polyline points="9 14 12 17 15 14"/>
      </svg>
      Export PDF
    </button>
  </div>
</header>

<main>
  <p class="section-label">Overview</p>
  <div class="summary-row">
    <div class="summary-card">
      <div class="summary-dot dot-green">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="summary-info">
        <strong id="count-green">—</strong>
        <p>On Target</p>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-dot dot-yellow">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <div class="summary-info">
        <strong id="count-yellow">—</strong>
        <p>Needs Attention</p>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-dot dot-red">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="summary-info">
        <strong id="count-red">—</strong>
        <p>Below Target</p>
      </div>
    </div>
  </div>

  <p class="section-label">Key Performance Indicators &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8">— click any value to edit</span></p>
  <div class="kpi-grid" id="kpi-grid"></div>
</main>

<footer>Q1 2026 Reporting Period &nbsp;|&nbsp; Values are editable — click any KPI number to update</footer>

<div class="toast" id="toast"></div>

<script>
  const kpis = [
    {
      name: "On Time Delivery Rate",
      current: 93.2,
      target: 95,
      unit: "%",
      lowerIsBetter: false,
      yellowThreshold: 2,
      trend: "+1.4% vs last month",
      trendUp: true,
    },
    {
      name: "Order Fill Rate",
      current: 97.4,
      target: 98,
      unit: "%",
      lowerIsBetter: false,
      yellowThreshold: 1,
      trend: "+0.6% vs last month",
      trendUp: true,
    },
    {
      name: "Inventory Accuracy",
      current: 99.4,
      target: 99,
      unit: "%",
      lowerIsBetter: false,
      yellowThreshold: 0.5,
      trend: "Stable vs last month",
      trendUp: null,
    },
    {
      name: "Forecast Accuracy (MAPE)",
      current: 8.5,
      target: 10,
      unit: "%",
      lowerIsBetter: true,
      yellowThreshold: 1.5,
      trend: "-0.9% vs last month",
      trendUp: true,
    },
    {
      name: "Warehouse Picking Accuracy",
      current: 98.7,
      target: 99.5,
      unit: "%",
      lowerIsBetter: false,
      yellowThreshold: 0.5,
      trend: "-0.2% vs last month",
      trendUp: false,
    },
    {
      name: "Perfect Order Rate",
      current: 90.8,
      target: 95,
      unit: "%",
      lowerIsBetter: false,
      yellowThreshold: 3,
      trend: "+2.1% vs last month",
      trendUp: true,
    },
  ];

  /* ── Helpers ── */
  function getStatus(current, kpi) {
    const { target, lowerIsBetter, yellowThreshold } = kpi;
    if (lowerIsBetter) {
      if (current <= target) return "green";
      if (current <= target + yellowThreshold) return "yellow";
      return "red";
    } else {
      if (current >= target) return "green";
      if (current >= target - yellowThreshold) return "yellow";
      return "red";
    }
  }

  function barWidth(current, kpi) {
    const { target, lowerIsBetter } = kpi;
    if (lowerIsBetter) {
      const max = target * 2;
      return Math.min(Math.max(0, (max - current) / max * 100), 100).toFixed(1);
    }
    return Math.min((current / target) * 100, 100).toFixed(1);
  }

  function statusColor(status) {
    return { green: "#16a34a", yellow: "#ca8a04", red: "#dc2626" }[status];
  }

  function trendArrowSVG(trendUp) {
    if (trendUp === null) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
    }
    return trendUp
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>`;
  }

  function chipArrowSVG(trendUp) {
    if (trendUp === null) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
    }
    return trendUp
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
  }

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
  }

  /* ── Refresh summary counts ── */
  function refreshSummary() {
    const cards = document.querySelectorAll(".kpi-card");
    let counts = { green: 0, yellow: 0, red: 0 };
    cards.forEach(c => {
      if (c.classList.contains("green"))  counts.green++;
      else if (c.classList.contains("yellow")) counts.yellow++;
      else counts.red++;
    });
    document.getElementById("count-green").textContent  = counts.green;
    document.getElementById("count-yellow").textContent = counts.yellow;
    document.getElementById("count-red").textContent    = counts.red;
  }

  /* ── Update a card after value edit ── */
  function updateCard(card, kpi, newValue) {
    const status = getStatus(newValue, kpi);
    const width  = barWidth(newValue, kpi);
    const color  = statusColor(status);

    card.className = `kpi-card ${status}`;

    card.querySelector(".kpi-current").style.color = color;
    card.querySelector(".status-badge").className = `status-badge badge-${status}`;
    card.querySelector(".status-badge").textContent = { green: "On Target", yellow: "Near Target", red: "Off Target" }[status];

    const fill = card.querySelector(".bar-fill");
    fill.className = `bar-fill fill-${status}`;
    fill.style.width = width + "%";

    refreshSummary();
  }

  /* ── Build cards ── */
  const grid = document.getElementById("kpi-grid");

  kpis.forEach(kpi => {
    const status = getStatus(kpi.current, kpi);
    const width  = barWidth(kpi.current, kpi);
    const color  = statusColor(status);
    const badgeText = { green: "On Target", yellow: "Near Target", red: "Off Target" }[status];

    const card = document.createElement("div");
    card.className = `kpi-card ${status}`;
    card.innerHTML = `
      <div class="kpi-header">
        <div class="kpi-name">${kpi.name}</div>
        <span class="status-badge badge-${status}">${badgeText}</span>
      </div>
      <div class="kpi-values">
        <div class="kpi-value-group">
          <span class="kpi-current" style="color:${color}" contenteditable="false" title="Click to edit">${kpi.current.toFixed(1)}</span>
          <span class="kpi-unit">${kpi.unit}</span>
        </div>
        <div class="trend-arrow">${trendArrowSVG(kpi.trendUp)}</div>
        <span class="edit-hint">✎ click to edit</span>
      </div>
      <div class="kpi-target">
        Target: <strong>${kpi.lowerIsBetter ? "below " : ""}${kpi.target.toFixed(1)}${kpi.unit}</strong>
      </div>
      <div class="bar-track">
        <div class="bar-fill fill-${status}" style="width:${width}%"></div>
      </div>
      <div class="bar-labels">
        <span>0${kpi.unit}</span>
        <span>Target ${kpi.target.toFixed(1)}${kpi.unit}</span>
      </div>
      <div class="trend-chip">
        ${chipArrowSVG(kpi.trendUp)}
        ${kpi.trend}
      </div>
    `;

    /* ── Inline editing ── */
    const valueEl = card.querySelector(".kpi-current");

    valueEl.addEventListener("click", () => {
      valueEl.contentEditable = "true";
      valueEl.focus();
      // select all text
      const range = document.createRange();
      range.selectNodeContents(valueEl);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    });

    valueEl.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); valueEl.blur(); }
      if (e.key === "Escape") {
        valueEl.textContent = kpi.current.toFixed(1);
        valueEl.contentEditable = "false";
      }
      // Only allow digits, dot, backspace, arrows, delete
      if (!/[\d.]|Backspace|Delete|Arrow/.test(e.key)) e.preventDefault();
    });

    valueEl.addEventListener("blur", () => {
      valueEl.contentEditable = "false";
      const raw = parseFloat(valueEl.textContent);
      if (isNaN(raw) || raw < 0 || raw > 999) {
        valueEl.textContent = kpi.current.toFixed(1);
        showToast("Invalid value — reverted");
        return;
      }
      const rounded = Math.round(raw * 10) / 10;
      kpi.current = rounded;
      valueEl.textContent = rounded.toFixed(1);
      updateCard(card, kpi, rounded);

      // update last-updated timestamp
      const now = new Date();
      document.getElementById("last-updated-time").textContent = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      showToast(`${kpi.name} updated to ${rounded.toFixed(1)}${kpi.unit}`);
    });

    grid.appendChild(card);
  });

  /* ── Initial summary & timestamp ── */
  refreshSummary();

  const now = new Date();
  const timeFmt = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  const dateFmt = now.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  document.getElementById("last-updated-time").textContent = `${dateFmt}, ${timeFmt}`;

  /* ── Export PDF ── */
  function exportPDF() {
    showToast("Opening print dialog…");
    setTimeout(() => window.print(), 300);
  }
</script>
</body>
</html>
